name: BazeWatch
options:
  bundleIdPrefix: com.bazewatch.personal
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGNING_ALLOWED: NO
targets:
  BazeWatchPhone:
    type: application
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bazewatch.personal.phone
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baze Watch
    dependencies:
      - target: BazeWatch
        embed: true
  BazeWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bazewatch.personal.phone.watchkitapp
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Baze Watch
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.bazewatch.personal.phone
schemes:
  BazeWatchPhone:
    build:
      targets:
        BazeWatchPhone: all
