name: Build installation test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned device applications
        run: >-
          xcodebuild -project BazeWatch.xcodeproj
          -scheme BazeWatchPhone -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify watch bundle and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/BazeWatchPhone.app
          test -d "$APP/Watch/BazeWatch.app"
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package
          zip -qry ../BazeWatch-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BazeWatch-installation-test
          path: BazeWatch-unsigned.ipa
          retention-days: 7
